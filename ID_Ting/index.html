<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="e-Boks">
    <link rel="manifest" href="manifest.json">
    <title>e-Boks</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="app">

    <!-- Top Action Buttons -->
    <div class="top-actions">
        <button class="btn-add" aria-label="Tilføj">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path d="M8.5 2v13M2 8.5h13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="btn-qr-scan" aria-label="Scan QR-kode">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M3 9V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 3h4a2 2 0 0 1 2 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 15v4a2 2 0 0 0 2 2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 15v4a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="9.5" y="9.5" width="5" height="5" rx="0.5" fill="currentColor"/>
            </svg>
        </button>
    </div>

    <!-- Page Title -->
    <h1 class="page-title">Hjem</h1>

    <!-- Card Carousel -->
    <div class="carousel-outer" id="carouselOuter">
        <div class="carousel-inner" id="carouselInner">

            <!-- Slide 1: e-Boks ID -->
            <div class="slide">
                <div class="card card--id">
                    <div class="card-shine"></div>
                    <div class="card-content">
                        <div class="card-top">
                            <img class="eboks-logo-img" src="assets/e-boks-logo-white.png" alt="e-Boks">
                            <span class="card-type-text">e-Boks ID</span>
                        </div>
                        <div class="card-bottom">
                            <div class="photo-wrap">
                                <img src="assets/person-image.jpg" alt="Foto" width="100%" height="100%" style="object-fit:cover;display:block;">
                            </div>
                            <div class="id-fields">
                                <div class="field">
                                    <div class="field-label">Navn</div>
                                    <div class="field-value">Victor Ninn Kuzimski</div>
                                </div>
                                <div class="field">
                                    <div class="field-label">Fødselsdag</div>
                                    <div class="field-value">24 sep, 2007</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Slide 2: Aldersbevis -->
            <div class="slide">
                <div class="card card--age">
                    <div class="card-shine"></div>
                    <div class="card-content">
                        <div class="card-top">
                            <img class="eboks-logo-img" src="assets/e-boks-logo-white.png" alt="e-Boks">
                            <span class="card-type-text">Aldersbevis</span>
                        </div>
                        <div class="card-bottom">
                            <div class="photo-wrap">
                                <img src="assets/person-image.jpg" alt="Foto" width="100%" height="100%" style="object-fit:cover;display:block;">
                            </div>
                            <div class="age-display">18+</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Pagination Dots -->
    <div class="dots">
        <div class="dot active" data-idx="0"></div>
        <div class="dot" data-idx="1"></div>
    </div>

    <!-- Action List -->
    <div class="actions-box">
        <button class="action-row" id="btnLandscape">
            <div class="action-icon-wrap">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect x="1.5" y="7" width="18" height="13" rx="2.5" stroke="#c0374a" stroke-width="1.8"/>
                    <path d="M22 5.5c3 2.2 4.5 5.8 3.2 9.5" stroke="#c0374a" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M25.2 15l-2 3.2 3 0.6" stroke="#c0374a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="action-text">Vandret visning</span>
        </button>
        <div class="action-sep"></div>
        <button class="action-row" id="btnShowQR">
            <div class="action-icon-wrap">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect x="2" y="2" width="10" height="10" rx="2" stroke="#c0374a" stroke-width="1.8"/>
                    <rect x="4.5" y="4.5" width="5" height="5" rx="0.5" fill="#c0374a"/>
                    <rect x="16" y="2" width="10" height="10" rx="2" stroke="#c0374a" stroke-width="1.8"/>
                    <rect x="18.5" y="4.5" width="5" height="5" rx="0.5" fill="#c0374a"/>
                    <rect x="2" y="16" width="10" height="10" rx="2" stroke="#c0374a" stroke-width="1.8"/>
                    <rect x="4.5" y="18.5" width="5" height="5" rx="0.5" fill="#c0374a"/>
                    <rect x="16" y="16" width="3.5" height="3.5" rx="0.5" fill="#c0374a"/>
                    <rect x="21" y="16" width="3.5" height="3.5" rx="0.5" fill="#c0374a"/>
                    <rect x="16" y="21" width="3.5" height="3.5" rx="0.5" fill="#c0374a"/>
                    <rect x="21" y="21" width="3.5" height="3.5" rx="0.5" fill="#c0374a"/>
                </svg>
            </div>
            <span class="action-text">Vis QR-kode</span>
        </button>
    </div>

</div><!-- .app -->

<!-- QR Modal -->
<div class="qr-modal" id="qrModal">
    <div class="qr-backdrop" id="qrBackdrop"></div>
    <div class="qr-sheet">
        <div class="qr-handle"></div>
        <p class="qr-title">QR-kode</p>
        <div class="qr-code-wrap">
            <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Simple QR code placeholder pattern -->
                <rect width="200" height="200" fill="white"/>
                <!-- Top-left finder -->
                <rect x="10" y="10" width="60" height="60" fill="black"/>
                <rect x="20" y="20" width="40" height="40" fill="white"/>
                <rect x="30" y="30" width="20" height="20" fill="black"/>
                <!-- Top-right finder -->
                <rect x="130" y="10" width="60" height="60" fill="black"/>
                <rect x="140" y="20" width="40" height="40" fill="white"/>
                <rect x="150" y="30" width="20" height="20" fill="black"/>
                <!-- Bottom-left finder -->
                <rect x="10" y="130" width="60" height="60" fill="black"/>
                <rect x="20" y="140" width="40" height="40" fill="white"/>
                <rect x="30" y="150" width="20" height="20" fill="black"/>
                <!-- Data modules (decorative) -->
                <rect x="80" y="10" width="10" height="10" fill="black"/>
                <rect x="100" y="10" width="10" height="10" fill="black"/>
                <rect x="110" y="20" width="10" height="10" fill="black"/>
                <rect x="80" y="30" width="10" height="10" fill="black"/>
                <rect x="100" y="30" width="10" height="10" fill="black"/>
                <rect x="80" y="50" width="10" height="10" fill="black"/>
                <rect x="110" y="50" width="10" height="10" fill="black"/>
                <rect x="10" y="80" width="10" height="10" fill="black"/>
                <rect x="30" y="80" width="10" height="10" fill="black"/>
                <rect x="50" y="80" width="10" height="10" fill="black"/>
                <rect x="80" y="80" width="10" height="10" fill="black"/>
                <rect x="100" y="80" width="10" height="10" fill="black"/>
                <rect x="120" y="80" width="10" height="10" fill="black"/>
                <rect x="140" y="80" width="10" height="10" fill="black"/>
                <rect x="160" y="80" width="10" height="10" fill="black"/>
                <rect x="180" y="80" width="10" height="10" fill="black"/>
                <rect x="80" y="100" width="10" height="10" fill="black"/>
                <rect x="110" y="100" width="10" height="10" fill="black"/>
                <rect x="140" y="100" width="10" height="10" fill="black"/>
                <rect x="160" y="100" width="10" height="10" fill="black"/>
                <rect x="80" y="120" width="10" height="10" fill="black"/>
                <rect x="100" y="120" width="10" height="10" fill="black"/>
                <rect x="130" y="120" width="10" height="10" fill="black"/>
                <rect x="160" y="120" width="10" height="10" fill="black"/>
                <rect x="80" y="140" width="10" height="10" fill="black"/>
                <rect x="110" y="140" width="10" height="10" fill="black"/>
                <rect x="130" y="140" width="10" height="10" fill="black"/>
                <rect x="150" y="140" width="10" height="10" fill="black"/>
                <rect x="80" y="160" width="10" height="10" fill="black"/>
                <rect x="100" y="160" width="10" height="10" fill="black"/>
                <rect x="120" y="160" width="10" height="10" fill="black"/>
                <rect x="140" y="160" width="10" height="10" fill="black"/>
                <rect x="170" y="160" width="10" height="10" fill="black"/>
                <rect x="80" y="180" width="10" height="10" fill="black"/>
                <rect x="110" y="180" width="10" height="10" fill="black"/>
                <rect x="150" y="180" width="10" height="10" fill="black"/>
                <rect x="180" y="180" width="10" height="10" fill="black"/>
            </svg>
        </div>
        <button class="qr-close" id="qrClose">Luk</button>
    </div>
</div>

<!-- Bottom Tab Bar -->
<nav class="tab-bar">
    <button class="tab tab--active" id="tabHjem">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M13 2v7h7" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>Hjem</span>
    </button>
    <button class="tab" id="tabSettings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Indstillinger</span>
    </button>
</nav>

<script src="index.js"></script>
</body>
</html>
